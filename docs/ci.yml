name: test-and-build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: true
      - run: go vet ./...
      - run: SESSMCP_LONG_TEST=1 go test -race ./... -count=1 -timeout 4m
      - run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sessmcp-binaries
          path: dist/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
      - run: go test ./... -timeout 1m
